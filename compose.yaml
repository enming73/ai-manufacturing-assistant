name: manufacturing-assistant
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    environment:
      ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-manufacturing};Username=${POSTGRES_USER:-manufacturing};Password="${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}";Timeout=5;Command Timeout=5'
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS:-true}
      Demo__SeedOnStartup: ${DEMO_SEED_ON_STARTUP:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      start_period: 60s
      interval: 10s
      timeout: 8s
      retries: 5
  agent:
    build: ./agent
    environment:
      BACKEND_BASE_URL: http://backend:8080
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:${AGENT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manufacturing}
      POSTGRES_USER: ${POSTGRES_USER:-manufacturing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:0.18.0
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  ollama-data:
