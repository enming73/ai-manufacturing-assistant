name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.9
          python-version: '3.12'
      - run: dotnet test backend/Manufacturing.slnx --configuration Release
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: uv sync --frozen && uv run --frozen pytest
        working-directory: agent
      - name: Compose integration smoke test
        env:
          POSTGRES_PASSWORD: ci-temporary-password
        run: |
          docker compose config -q
          docker compose up --build --wait --wait-timeout 180
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:5173/
          curl --fail http://localhost:5173/api/health
          docker compose exec -T postgres psql -U manufacturing -d manufacturing -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"
      - name: Compose diagnostics
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-temporary-password
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        env:
          POSTGRES_PASSWORD: ci-temporary-password
        run: docker compose down --volumes
